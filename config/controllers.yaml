controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mcp_effort_controller:
      type: effort_controllers/JointGroupEffortController
    pip_effort_controller:
      type: effort_controllers/JointGroupEffortController
    dip_effort_controller:
      type: effort_controllers/JointGroupEffortController

mcp_effort_controller:
  ros__parameters:
    joints:
      - pinky_mcp_joint
      - ring_mcp_joint
      - middle_mcp_joint
      - index_mcp_joint
      - thumb_mcp_joint
pip_effort_controller:
  ros__parameters:
    joints:
      - pinky_pip_joint
      - ring_pip_joint
      - middle_pip_joint
      - index_pip_joint
      - thumb_pip_joint
dip_effort_controller:
  ros__parameters:
    joints:
      - pinky_dip_joint
      - ring_dip_joint
      - middle_dip_joint
      - index_dip_joint
      - thumb_dip_joint
